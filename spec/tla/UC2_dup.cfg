\* Checked bound, approved 2026-11-23, complements UC2.cfg: keeps duplicate delivery (MaxCopies = 2) with 1 id, qty 1, ttl 1..2, total 1, clock <= 3, 1 sku. Covers DupFollowsFromPins paths. Runs against UC2.tla.
SPECIFICATION Spec
CONSTANTS
    Ids = {1}
    EvSkus = {0}
    Qtys = {1}
    Ttls = {1, 2}
    Total = 1
    MaxClock = 3
    MaxCrashes = 1
    MaxCopies = 2
INVARIANT TypeOK
INVARIANT NonNegativeAvailable
INVARIANT Conservation
INVARIANT ExpiredReturnedOnce
INVARIANT ReleasedMatchesReturned
INVARIANT ConfirmedBeforeDue
INVARIANT CountersMatchRecords
INVARIANT UniqueIdsKnownSku
PROPERTY ExpiredNeverConfirmed
PROPERTY NoOversell
PROPERTY ConfirmOnlyBeforeDue
PROPERTY PinDown
PROPERTY PinTick
PROPERTY PinReserveOk
PROPERTY PinReserveRejected
PROPERTY PinConfirmOk
PROPERTY PinConfirmRejected
PROPERTY PinExpireOk
PROPERTY PinExpireRejected
PROPERTY PinCrash
PROPERTY PinRestart
PROPERTY FieldsStable
