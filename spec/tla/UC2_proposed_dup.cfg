INVARIANT NonNegativeAvailable
INVARIANT Conservation
INVARIANT ExpiredReturnedOnce
INVARIANT ReleasedMatchesReturned
INVARIANT ConfirmedBeforeDue
INVARIANT CountersMatchRecords
INVARIANT UniqueIdsKnownSku
